[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rocsa-generator"
version = "0.1.0"
description = "ROCSA Compiler - Scientific Atomic Controls Generator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.16.0",
    "rich>=13.7.0",
    "jinja2>=3.1.4",
    "pyyaml>=6.0.2",
    "pydantic>=2.8.2",
    "pydantic-settings>=2.0.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "jsonschema>=4.23"]

[project.scripts]
rocsa = "cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["src"]
